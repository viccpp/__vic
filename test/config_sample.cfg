#
# Sample cfg
#

# String parameter
str_param: abc efg hijk

# Unknown size int parameter
int_param: 1

# Int32 parameter
int32_param: 65536

# Unknown to parser parameter
#unknown_parameter: 0

<config_include.cfg>

small_param: 8

# "true" or "yes" may be used as well
bool_param: 1

cdr_decoders: vendor1 format1 load_path1 input_config1
cdr_decoders: vendor2 format2 load_path2 input_config2

size_param: 2M

unsigned_param: 45

ipv4_addr_param: 127.0.0.1

optional_param: 3

multiline <<EOF
line 1
line 2
EOF

complex_param (
    param1: 1
    param2 {
        "v1"
        "v2"
    }
)
